<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Poker with friends: real cards with chips kept by the app, or fully online." />
    <!-- Link previews (Telegram, WhatsApp…). One shared image for every invite; the invite text names the table. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poker Chips" />
    <meta property="og:title" content="Poker Chips" />
    <meta property="og:description" content="Poker with friends: real cards with chips kept by the app, or fully online." />
    <meta property="og:image" content="https://poker-chips.expo.app/og-en.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Poker chips and cards on a red felt table" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Installable web app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F1830" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Navy before the app paints, so there is no white flash. */
        background-color: #0f1830;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
